# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "com.diffplug.spotless:spotless-plugin-gradle"
      - dependency-name: "pl.allegro.tech.build:axion-release-plugin"
      - dependency-name: "org.apache.sshd:sshd-common"
      # Jakarta Persistence 3.2+ is Jakarta EE 11, which would force the migration on downstream users
      - dependency-name: "jakarta.persistence:jakarta.persistence-api"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Gradle 9.x removes APIs this build still uses (see the deprecation warnings on Gradle 8)
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
